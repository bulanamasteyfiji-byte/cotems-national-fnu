<svg viewBox="0 0 1300 820" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1300" height="820" fill="#f7f9fb"/>
  <text x="650" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f3057">COTEMS-National — Deployment &amp; Network Topology</text>
  <text x="650" y="60" text-anchor="middle" font-size="13" fill="#5b6b7a">Distributed campuses, central cloud, offline-first mustering</text>

  <!-- Central cloud -->
  <g>
    <rect x="470" y="90" width="360" height="140" rx="14" fill="#0f3057"/>
    <text x="650" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">FNU NATIONAL CLOUD PLATFORM</text>
    <text x="650" y="140" text-anchor="middle" font-size="11" fill="#cfe0ee">Central DB · API Gateway · Auth (SSO)</text>
    <text x="650" y="157" text-anchor="middle" font-size="11" fill="#cfe0ee">National OHS &amp; Security Dashboard</text>
    <text x="650" y="174" text-anchor="middle" font-size="11" fill="#cfe0ee">Analytics · Audit Log · Notification Svc</text>
    <text x="650" y="191" text-anchor="middle" font-size="11" fill="#cfe0ee">(hosted, e.g. Suva data centre / cloud)</text>
    <text x="650" y="211" text-anchor="middle" font-size="10" fill="#8fb4d9">Nasinu HQ — Emergency Command Centre access</text>
  </g>

  <!-- Campus nodes -->
  <!-- Nasinu -->
  <g>
    <rect x="60" y="300" width="200" height="130" rx="10" fill="#ffffff" stroke="#0e7c7b" stroke-width="1.5"/>
    <rect x="60" y="300" width="200" height="30" rx="10" fill="#0e7c7b"/>
    <text x="160" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">NASINU (HQ)</text>
    <text x="75" y="345" font-size="11" fill="#333">Local edge server / cache</text>
    <text x="75" y="362" font-size="11" fill="#333">Building QR readers</text>
    <text x="75" y="379" font-size="11" fill="#333">Security &amp; warden tablets</text>
    <text x="75" y="396" font-size="11" fill="#333">Campus-wide WiFi</text>
    <text x="75" y="413" font-size="10" fill="#0e7c7b">Central Div.</text>
  </g>

  <!-- Nasese -->
  <g>
    <rect x="300" y="300" width="200" height="130" rx="10" fill="#ffffff" stroke="#0e7c7b" stroke-width="1.5"/>
    <rect x="300" y="300" width="200" height="30" rx="10" fill="#0e7c7b"/>
    <text x="400" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">NASESE</text>
    <text x="315" y="345" font-size="11" fill="#333">Local edge server / cache</text>
    <text x="315" y="362" font-size="11" fill="#333">Building QR readers</text>
    <text x="315" y="379" font-size="11" fill="#333">Security &amp; warden tablets</text>
    <text x="315" y="396" font-size="11" fill="#333">Campus-wide WiFi</text>
    <text x="315" y="413" font-size="10" fill="#0e7c7b">Central Div.</text>
  </g>

  <!-- Koronivia -->
  <g>
    <rect x="540" y="300" width="200" height="130" rx="10" fill="#ffffff" stroke="#0e7c7b" stroke-width="1.5"/>
    <rect x="540" y="300" width="200" height="30" rx="10" fill="#0e7c7b"/>
    <text x="640" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">KORONIVIA</text>
    <text x="555" y="345" font-size="11" fill="#333">Local edge server / cache</text>
    <text x="555" y="362" font-size="11" fill="#333">Building QR readers</text>
    <text x="555" y="379" font-size="11" fill="#333">Security &amp; warden tablets</text>
    <text x="555" y="396" font-size="11" fill="#333">Campus-wide WiFi</text>
    <text x="555" y="413" font-size="10" fill="#0e7c7b">Central Div.</text>
  </g>

  <!-- Namaka Nadi -->
  <g>
    <rect x="780" y="300" width="200" height="130" rx="10" fill="#ffffff" stroke="#1c6e8c" stroke-width="1.5"/>
    <rect x="780" y="300" width="200" height="30" rx="10" fill="#1c6e8c"/>
    <text x="880" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">NAMAKA (NADI)</text>
    <text x="795" y="345" font-size="11" fill="#333">Local edge server / cache</text>
    <text x="795" y="362" font-size="11" fill="#333">Building QR readers</text>
    <text x="795" y="379" font-size="11" fill="#333">Security &amp; warden tablets</text>
    <text x="795" y="396" font-size="11" fill="#333">Campus-wide WiFi</text>
    <text x="795" y="413" font-size="10" fill="#1c6e8c">Western Div.</text>
  </g>

  <!-- Natabua Lautoka -->
  <g>
    <rect x="1020" y="300" width="200" height="130" rx="10" fill="#ffffff" stroke="#1c6e8c" stroke-width="1.5"/>
    <rect x="1020" y="300" width="200" height="30" rx="10" fill="#1c6e8c"/>
    <text x="1120" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">NATABUA (LAUTOKA)</text>
    <text x="1035" y="345" font-size="11" fill="#333">Local edge server / cache</text>
    <text x="1035" y="362" font-size="11" fill="#333">Building QR readers</text>
    <text x="1035" y="379" font-size="11" fill="#333">Security &amp; warden tablets</text>
    <text x="1035" y="396" font-size="11" fill="#333">Campus-wide WiFi</text>
    <text x="1035" y="413" font-size="10" fill="#1c6e8c">Western Div.</text>
  </g>

  <!-- Ba -->
  <g>
    <rect x="300" y="470" width="200" height="130" rx="10" fill="#ffffff" stroke="#1c6e8c" stroke-width="1.5"/>
    <rect x="300" y="470" width="200" height="30" rx="10" fill="#1c6e8c"/>
    <text x="400" y="490" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">BA</text>
    <text x="315" y="515" font-size="11" fill="#333">Local edge server / cache</text>
    <text x="315" y="532" font-size="11" fill="#333">Building QR readers</text>
    <text x="315" y="549" font-size="11" fill="#333">Security &amp; warden tablets</text>
    <text x="315" y="566" font-size="11" fill="#333">Campus-wide WiFi</text>
    <text x="315" y="583" font-size="10" fill="#1c6e8c">Western Div. (outreach)</text>
  </g>

  <!-- Labasa -->
  <g>
    <rect x="540" y="470" width="200" height="130" rx="10" fill="#ffffff" stroke="#c1440e" stroke-width="1.5"/>
    <rect x="540" y="470" width="200" height="30" rx="10" fill="#c1440e"/>
    <text x="640" y="490" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">LABASA</text>
    <text x="555" y="515" font-size="11" fill="#333">Local edge server / cache</text>
    <text x="555" y="532" font-size="11" fill="#333">Building QR readers</text>
    <text x="555" y="549" font-size="11" fill="#333">Security &amp; warden tablets</text>
    <text x="555" y="566" font-size="11" fill="#333">Campus-wide WiFi (+4G backup)</text>
    <text x="555" y="583" font-size="10" fill="#c1440e">Northern Div. — Vanua Levu</text>
  </g>

  <!-- Pasifika -->
  <g>
    <rect x="780" y="470" width="200" height="130" rx="10" fill="#ffffff" stroke="#0e7c7b" stroke-width="1.5"/>
    <rect x="780" y="470" width="200" height="30" rx="10" fill="#0e7c7b"/>
    <text x="880" y="490" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">PASIFIKA (SUVA)</text>
    <text x="795" y="515" font-size="11" fill="#333">Local edge server / cache</text>
    <text x="795" y="532" font-size="11" fill="#333">Building QR readers</text>
    <text x="795" y="549" font-size="11" fill="#333">Security &amp; warden tablets</text>
    <text x="795" y="566" font-size="11" fill="#333">Campus-wide WiFi</text>
    <text x="795" y="583" font-size="10" fill="#0e7c7b">Central Div.</text>
  </g>

  <!-- Connecting lines -->
  <line x1="160" y1="300" x2="560" y2="230" stroke="#5b6b7a" stroke-width="1.3"/>
  <line x1="400" y1="300" x2="600" y2="230" stroke="#5b6b7a" stroke-width="1.3"/>
  <line x1="640" y1="300" x2="650" y2="230" stroke="#5b6b7a" stroke-width="1.3"/>
  <line x1="880" y1="300" x2="700" y2="230" stroke="#5b6b7a" stroke-width="1.3"/>
  <line x1="1120" y1="300" x2="740" y2="230" stroke="#5b6b7a" stroke-width="1.3"/>
  <line x1="400" y1="470" x2="550" y2="240" stroke="#5b6b7a" stroke-width="1.3"/>
  <line x1="640" y1="470" x2="620" y2="240" stroke="#5b6b7a" stroke-width="1.3" stroke-dasharray="5,4"/>
  <line x1="880" y1="470" x2="680" y2="240" stroke="#5b6b7a" stroke-width="1.3"/>

  <text x="620" y="255" font-size="10" fill="#c1440e">satellite / 4G backup link</text>

  <!-- Legend / notes -->
  <g transform="translate(60,650)">
    <rect x="0" y="0" width="1160" height="140" rx="10" fill="#ffffff" stroke="#d7dee5"/>
    <text x="20" y="26" font-size="13" font-weight="700" fill="#0f3057">Design notes</text>
    <text x="20" y="50" font-size="11.5" fill="#333">1. Each campus runs a lightweight local edge cache so QR check-in/out keeps working during internet outages; queued events sync when connectivity returns.</text>
    <text x="20" y="70" font-size="11.5" fill="#333">2. All campuses write to the same national schema (campus_id on every record) so OHS/security can view occupancy per-building, per-campus, or nationally.</text>
    <text x="20" y="90" font-size="11.5" fill="#333">3. Labasa (Vanua Levu) has a 4G/satellite backup link given greater distance from central infrastructure and less reliable fixed connectivity.</text>
    <text x="20" y="110" font-size="11.5" fill="#333">4. A campus can declare and run its own emergency mustering independently of the national link — local-first, cloud-synced.</text>
    <text x="20" y="130" font-size="11.5" fill="#333">5. National OHS Command Centre (Nasinu HQ) has read access to all campuses; each campus warden/security sees only their own campus by default.</text>
  </g>
</svg>
