<svg viewBox="0 0 1300 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f3057"/>
    </marker>
  </defs>
  <rect width="1300" height="560" fill="#f7f9fb"/>
  <text x="650" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f3057">Registration &amp; QR Issuance Workflow (COTEMS-National)</text>
  <text x="650" y="54" text-anchor="middle" font-size="12.5" fill="#5b6b7a">Students and staff are onboarded once, through the Campus Warden's account — the QR code is never created manually</text>

  <!-- Lanes -->
  <g font-size="12.5" font-weight="700" fill="#ffffff">
    <rect x="0" y="80" width="170" height="120" fill="#c1440e"/>
    <text x="85" y="135" text-anchor="middle">CAMPUS</text>
    <text x="85" y="151" text-anchor="middle">WARDEN</text>

    <rect x="0" y="200" width="170" height="120" fill="#0e7c7b"/>
    <text x="85" y="255" text-anchor="middle">COTEMS</text>
    <text x="85" y="271" text-anchor="middle">SYSTEM</text>

    <rect x="0" y="320" width="170" height="120" fill="#0f3057"/>
    <text x="85" y="375" text-anchor="middle">STUDENT /</text>
    <text x="85" y="391" text-anchor="middle">STAFF</text>
  </g>
  <rect x="170" y="80" width="1130" height="120" fill="#fbe9dd" stroke="#e3e8ec"/>
  <rect x="170" y="200" width="1130" height="120" fill="#dcefee" stroke="#e3e8ec"/>
  <rect x="170" y="320" width="1130" height="120" fill="#ffffff" stroke="#e3e8ec"/>

  <!-- Warden lane -->
  <circle cx="230" cy="140" r="20" fill="#c1440e"/>
  <text x="230" y="144" text-anchor="middle" font-size="10" fill="#fff">Start</text>
  <text x="230" y="170" text-anchor="middle" font-size="10" fill="#333">New enrolee</text>
  <text x="230" y="182" text-anchor="middle" font-size="10" fill="#333">arrives</text>

  <rect x="300" y="115" width="190" height="50" rx="8" fill="#ffffff" stroke="#c1440e"/>
  <text x="395" y="135" text-anchor="middle" font-size="11" fill="#c1440e">Opens "Register student /</text>
  <text x="395" y="149" text-anchor="middle" font-size="11" fill="#c1440e">staff" in warden account</text>

  <rect x="530" y="115" width="220" height="50" rx="8" fill="#ffffff" stroke="#c1440e"/>
  <text x="640" y="135" text-anchor="middle" font-size="11" fill="#c1440e">Enters name, FNU ID, role,</text>
  <text x="640" y="149" text-anchor="middle" font-size="11" fill="#c1440e">college, home campus</text>

  <rect x="1010" y="115" width="180" height="50" rx="8" fill="#ffffff" stroke="#c1440e"/>
  <text x="1100" y="135" text-anchor="middle" font-size="11" fill="#c1440e">Downloads / prints QR</text>
  <text x="1100" y="149" text-anchor="middle" font-size="11" fill="#c1440e">and hands it to the person</text>

  <!-- System lane -->
  <rect x="800" y="235" width="200" height="50" rx="8" fill="#ffffff" stroke="#0e7c7b"/>
  <text x="900" y="255" text-anchor="middle" font-size="11" fill="#0e7c7b">Checks FNU ID is unique</text>
  <text x="900" y="269" text-anchor="middle" font-size="11" fill="#0e7c7b">across all campuses</text>

  <rect x="580" y="235" width="190" height="50" rx="8" fill="#ffffff" stroke="#0e7c7b"/>
  <text x="675" y="255" text-anchor="middle" font-size="11" fill="#0e7c7b">Creates Person record</text>
  <text x="675" y="269" text-anchor="middle" font-size="11" fill="#0e7c7b">(campus-scoped)</text>

  <rect x="360" y="235" width="190" height="50" rx="8" fill="#ffffff" stroke="#0e7c7b"/>
  <text x="455" y="255" text-anchor="middle" font-size="11" fill="#0e7c7b">Generates a unique QR</text>
  <text x="455" y="269" text-anchor="middle" font-size="11" fill="#0e7c7b">token &amp; payload automatically</text>

  <rect x="1010" y="235" width="180" height="50" rx="8" fill="#ffffff" stroke="#0e7c7b"/>
  <text x="1100" y="255" text-anchor="middle" font-size="11" fill="#0e7c7b">Logs the registration</text>
  <text x="1100" y="269" text-anchor="middle" font-size="11" fill="#0e7c7b">action to the audit trail</text>

  <!-- Student lane -->
  <rect x="1010" y="355" width="180" height="50" rx="8" fill="#eef3f8" stroke="#0f3057"/>
  <text x="1100" y="375" text-anchor="middle" font-size="11" fill="#0f3057">Keeps QR on phone /</text>
  <text x="1100" y="389" text-anchor="middle" font-size="11" fill="#0f3057">printed ID card</text>

  <circle cx="1240" cy="380" r="20" fill="#0f3057"/>
  <text x="1240" y="384" text-anchor="middle" font-size="10" fill="#fff">End</text>

  <!-- Flows -->
  <line x1="250" y1="140" x2="300" y2="140" stroke="#0f3057" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="490" y1="140" x2="530" y2="140" stroke="#0f3057" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="640" y1="165" x2="455" y2="235" stroke="#0f3057" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow2)"/>
  <text x="500" y="205" font-size="9" fill="#5b6b7a">submits form</text>

  <line x1="455" y1="235" x2="675" y2="235" stroke="#0f3057" stroke-width="1.6" marker-end="url(#arrow2)" transform="translate(0,25)"/>
  <line x1="550" y1="260" x2="580" y2="260" stroke="#0f3057" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="770" y1="260" x2="800" y2="260" stroke="#0f3057" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="1000" y1="260" x2="1010" y2="260" stroke="#0f3057" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <line x1="1100" y1="235" x2="1100" y2="165" stroke="#0f3057" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="1112" y="200" font-size="9" fill="#5b6b7a">QR ready</text>

  <line x1="1100" y1="165" x2="1100" y2="355" stroke="#0f3057" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow2)"/>
  <text x="1150" y="300" font-size="9" fill="#5b6b7a">QR handed over</text>
  <line x1="1190" y1="380" x2="1220" y2="380" stroke="#0f3057" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <text x="650" y="510" text-anchor="middle" font-size="11.5" fill="#5b6b7a">This one-time registration replaces manual ID card printing entirely — the QR is generated the instant the warden submits the form, and can be re-issued from the Registered Directory at any time.</text>
  <text x="650" y="530" text-anchor="middle" font-size="11.5" fill="#5b6b7a">From this point forward, the same QR is what the student/staff member scans at every building entrance, at every campus, to check in and out.</text>
</svg>
