<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="crow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2,2 L10,7 L2,12" fill="none" stroke="#0f3057" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="#f7f9fb"/>
  <text x="700" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f3057">COTEMS-National — Entity Relationship Diagram</text>
  <text x="700" y="60" text-anchor="middle" font-size="13" fill="#5b6b7a">Multi-campus occupant tracking &amp; emergency mustering data model</text>

  <!-- Campus -->
  <g>
    <rect x="40" y="100" width="220" height="150" rx="8" fill="#0f3057"/>
    <rect x="40" y="100" width="220" height="34" rx="8" fill="#0f3057"/>
    <text x="150" y="123" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">CAMPUS</text>
    <rect x="40" y="134" width="220" height="116" fill="#ffffff" stroke="#0f3057" stroke-width="1.5"/>
    <text x="55" y="153" font-size="12" fill="#0f3057">PK campus_id</text>
    <text x="55" y="171" font-size="12" fill="#333">name</text>
    <text x="55" y="189" font-size="12" fill="#333">division (Central/West/North)</text>
    <text x="55" y="207" font-size="12" fill="#333">address, coordinator</text>
    <text x="55" y="225" font-size="12" fill="#333">ohs_warden_contact</text>
  </g>

  <!-- Building -->
  <g>
    <rect x="340" y="100" width="220" height="150" rx="8" fill="#0e7c7b"/>
    <rect x="340" y="100" width="220" height="34" rx="8" fill="#0e7c7b"/>
    <text x="450" y="123" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">BUILDING</text>
    <rect x="340" y="134" width="220" height="116" fill="#ffffff" stroke="#0e7c7b" stroke-width="1.5"/>
    <text x="355" y="153" font-size="12" fill="#0e7c7b">PK building_id</text>
    <text x="355" y="171" font-size="12" fill="#333">FK campus_id</text>
    <text x="355" y="189" font-size="12" fill="#333">name, floors</text>
    <text x="355" y="207" font-size="12" fill="#333">max_occupancy</text>
    <text x="355" y="225" font-size="12" fill="#333">muster_point_id</text>
  </g>

  <!-- Room -->
  <g>
    <rect x="640" y="100" width="220" height="150" rx="8" fill="#0e7c7b"/>
    <rect x="640" y="100" width="220" height="34" rx="8" fill="#0e7c7b"/>
    <text x="750" y="123" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">ROOM / SPACE</text>
    <rect x="640" y="134" width="220" height="116" fill="#ffffff" stroke="#0e7c7b" stroke-width="1.5"/>
    <text x="655" y="153" font-size="12" fill="#0e7c7b">PK room_id</text>
    <text x="655" y="171" font-size="12" fill="#333">FK building_id</text>
    <text x="655" y="189" font-size="12" fill="#333">room_type, floor</text>
    <text x="655" y="207" font-size="12" fill="#333">capacity</text>
    <text x="655" y="225" font-size="12" fill="#333">qr_code_token</text>
  </g>

  <!-- Muster Point -->
  <g>
    <rect x="940" y="100" width="220" height="150" rx="8" fill="#c1440e"/>
    <rect x="940" y="100" width="220" height="34" rx="8" fill="#c1440e"/>
    <text x="1050" y="123" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">MUSTER POINT</text>
    <rect x="940" y="134" width="220" height="116" fill="#ffffff" stroke="#c1440e" stroke-width="1.5"/>
    <text x="955" y="153" font-size="12" fill="#c1440e">PK muster_point_id</text>
    <text x="955" y="171" font-size="12" fill="#333">FK campus_id</text>
    <text x="955" y="189" font-size="12" fill="#333">name, gps_coords</text>
    <text x="955" y="207" font-size="12" fill="#333">assembly_capacity</text>
    <text x="955" y="225" font-size="12" fill="#333">assigned_warden</text>
  </g>

  <!-- Person -->
  <g>
    <rect x="40" y="380" width="240" height="204" rx="8" fill="#0f3057"/>
    <rect x="40" y="380" width="240" height="34" rx="8" fill="#0f3057"/>
    <text x="160" y="403" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">PERSON</text>
    <rect x="40" y="414" width="240" height="170" fill="#ffffff" stroke="#0f3057" stroke-width="1.5"/>
    <text x="55" y="433" font-size="12" fill="#0f3057">PK person_id</text>
    <text x="55" y="451" font-size="12" fill="#333">id_number</text>
    <text x="55" y="469" font-size="12" fill="#333">qr_token, qr_payload</text>
    <text x="55" y="487" font-size="12" fill="#333">name, role (student/staff/visitor)</text>
    <text x="55" y="505" font-size="12" fill="#333">FK home_campus_id</text>
    <text x="55" y="523" font-size="12" fill="#333">college/department, mobile</text>
    <text x="55" y="541" font-size="12" fill="#333">registered_by (warden)</text>
    <text x="55" y="559" font-size="12" fill="#333">registered_at</text>
  </g>

  <!-- CheckInEvent -->
  <g>
    <rect x="380" y="380" width="260" height="170" rx="8" fill="#1c6e8c"/>
    <rect x="380" y="380" width="260" height="34" rx="8" fill="#1c6e8c"/>
    <text x="510" y="403" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">CHECK-IN EVENT</text>
    <rect x="380" y="414" width="260" height="136" fill="#ffffff" stroke="#1c6e8c" stroke-width="1.5"/>
    <text x="395" y="433" font-size="12" fill="#1c6e8c">PK event_id</text>
    <text x="395" y="451" font-size="12" fill="#333">FK person_id, FK room_id</text>
    <text x="395" y="469" font-size="12" fill="#333">FK building_id, FK campus_id</text>
    <text x="395" y="487" font-size="12" fill="#333">check_in_time, check_out_time</text>
    <text x="395" y="505" font-size="12" fill="#333">method (QR/manual), device_id</text>
    <text x="395" y="523" font-size="12" fill="#333">sync_status (synced/offline_queued)</text>
  </g>

  <!-- EmergencyEvent -->
  <g>
    <rect x="780" y="380" width="240" height="170" rx="8" fill="#c1440e"/>
    <rect x="780" y="380" width="240" height="34" rx="8" fill="#c1440e"/>
    <text x="900" y="403" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">EMERGENCY EVENT</text>
    <rect x="780" y="414" width="240" height="136" fill="#ffffff" stroke="#c1440e" stroke-width="1.5"/>
    <text x="795" y="433" font-size="12" fill="#c1440e">PK emergency_id</text>
    <text x="795" y="451" font-size="12" fill="#333">FK campus_id (or ALL)</text>
    <text x="795" y="469" font-size="12" fill="#333">type (fire/drill/other)</text>
    <text x="795" y="487" font-size="12" fill="#333">declared_by, declared_at</text>
    <text x="795" y="505" font-size="12" fill="#333">status (active/cleared)</text>
    <text x="795" y="523" font-size="12" fill="#333">cleared_at, duration</text>
  </g>

  <!-- MusterRecord -->
  <g>
    <rect x="1060" y="380" width="260" height="170" rx="8" fill="#c1440e"/>
    <rect x="1060" y="380" width="260" height="34" rx="8" fill="#c1440e"/>
    <text x="1190" y="403" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">MUSTER RECORD</text>
    <rect x="1060" y="414" width="260" height="136" fill="#ffffff" stroke="#c1440e" stroke-width="1.5"/>
    <text x="1075" y="433" font-size="12" fill="#c1440e">PK roll_id</text>
    <text x="1075" y="451" font-size="12" fill="#333">FK emergency_id, FK person_id</text>
    <text x="1075" y="469" font-size="12" fill="#333">FK last_known_room_id</text>
    <text x="1075" y="487" font-size="12" fill="#333">status (accounted/missing/</text>
    <text x="1075" y="505" font-size="12" fill="#333">self-reported/cleared_by_warden)</text>
    <text x="1075" y="523" font-size="12" fill="#333">accounted_at, accounted_by</text>
  </g>

  <!-- National OHS Dashboard -->
  <g>
    <rect x="1060" y="640" width="260" height="130" rx="8" fill="#5b6b7a"/>
    <rect x="1060" y="640" width="260" height="34" rx="8" fill="#5b6b7a"/>
    <text x="1190" y="663" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">AUDIT LOG</text>
    <rect x="1060" y="674" width="260" height="96" fill="#ffffff" stroke="#5b6b7a" stroke-width="1.5"/>
    <text x="1075" y="693" font-size="12" fill="#5b6b7a">PK log_id</text>
    <text x="1075" y="711" font-size="12" fill="#333">FK campus_id, actor_id</text>
    <text x="1075" y="729" font-size="12" fill="#333">action, entity, timestamp</text>
    <text x="1075" y="747" font-size="12" fill="#333">ip/device metadata</text>
  </g>

  <!-- Relationships -->
  <line x1="260" y1="175" x2="340" y2="175" stroke="#0f3057" stroke-width="1.5" marker-end="url(#crow)"/>
  <text x="290" y="168" font-size="11" fill="#5b6b7a">1..n</text>
  <line x1="560" y1="175" x2="640" y2="175" stroke="#0f3057" stroke-width="1.5" marker-end="url(#crow)"/>
  <text x="590" y="168" font-size="11" fill="#5b6b7a">1..n</text>
  <line x1="860" y1="175" x2="940" y2="175" stroke="#0f3057" stroke-width="1.5" marker-end="url(#crow)"/>
  <text x="880" y="168" font-size="11" fill="#5b6b7a">n..1</text>

  <line x1="160" y1="380" x2="160" y2="250" stroke="#0f3057" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="160" y1="250" x2="750" y2="250" stroke="#0f3057" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="510" y1="380" x2="750" y2="380" stroke="#0f3057" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="640" y="270" font-size="11" fill="#5b6b7a">home_campus (FK)</text>

  <line x1="280" y1="465" x2="380" y2="465" stroke="#1c6e8c" stroke-width="1.5" marker-end="url(#crow)"/>
  <text x="300" y="458" font-size="11" fill="#5b6b7a">1..n</text>
  <line x1="640" y1="465" x2="700" y2="465" stroke="#1c6e8c" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="700" y1="465" x2="700" y2="250" stroke="#1c6e8c" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="705" y="320" font-size="11" fill="#5b6b7a">room (FK)</text>

  <line x1="1020" y1="465" x2="1060" y2="465" stroke="#c1440e" stroke-width="1.5" marker-end="url(#crow)"/>
  <text x="1030" y="458" font-size="11" fill="#5b6b7a">1..n</text>
  <line x1="900" y1="380" x2="900" y2="250" stroke="#c1440e" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="900" y1="250" x2="1050" y2="250" stroke="#c1440e" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="940" y="270" font-size="11" fill="#5b6b7a">campus scope</text>

  <line x1="160" y1="584" x2="160" y2="600" stroke="#0f3057" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="160" y1="600" x2="1190" y2="600" stroke="#5b6b7a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="1190" y1="600" x2="1190" y2="640" stroke="#5b6b7a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="600" y="593" font-size="11" fill="#5b6b7a">every check-in / muster action is logged</text>

  <!-- Legend -->
  <g transform="translate(40,800)">
    <rect x="0" y="0" width="16" height="16" fill="#0f3057"/><text x="22" y="13" font-size="12" fill="#333">Identity &amp; location</text>
    <rect x="200" y="0" width="16" height="16" fill="#1c6e8c"/><text x="222" y="13" font-size="12" fill="#333">Real-time occupancy</text>
    <rect x="420" y="0" width="16" height="16" fill="#c1440e"/><text x="442" y="13" font-size="12" fill="#333">Emergency &amp; mustering</text>
    <rect x="660" y="0" width="16" height="16" fill="#5b6b7a"/><text x="682" y="13" font-size="12" fill="#333">Governance &amp; audit</text>
  </g>
</svg>
